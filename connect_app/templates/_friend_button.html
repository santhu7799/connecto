{# expects: u (user row), status, next_url #}
{% if status == 'friends' %}
  <a class="btn btn-small" href="{{ url_for('chat', user_id=u.id) }}">💬 Message</a>
{% elif status == 'sent' %}
  <form method="post" action="{{ url_for('remove_friend', user_id=u.id) }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next_url }}">
    <button class="btn btn-small btn-ghost" title="Cancel request">Requested ✓</button>
  </form>
{% elif status == 'received' %}
  <form method="post" action="{{ url_for('accept_request', user_id=u.id) }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next_url }}">
    <button class="btn btn-small">Accept request</button>
  </form>
{% else %}
  <form method="post" action="{{ url_for('send_request', user_id=u.id) }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next_url }}">
    <button class="btn btn-small">+ Add friend</button>
  </form>
{% endif %}
